# Local dev infrastructure. Ports bind to 127.0.0.1 only. Credentials are dev-only.
# Host ports come from the root .env when run with --env-file .env; the defaults below apply otherwise.
# Monitoring services start only with --profile observability.
name: freightaudit

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 5s

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: freightaudit
      POSTGRES_PASSWORD: freightaudit
      POSTGRES_DB: freightaudit
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pg_isready", "-U", "freightaudit", "-d", "freightaudit"]

  redis:
    image: redis:8.10.2-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  # Upstream minio/minio images were withdrawn; pgsty/minio is the maintained drop-in fork.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: freightaudit
      MINIO_ROOT_PASSWORD: freightaudit
    ports: ["127.0.0.1:${MINIO_PORT:-9000}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]

  # The collector image has no shell, so a static busybox is added for the healthcheck.
  otel-collector:
    profiles: [observability]
    build:
      dockerfile_inline: |
        FROM busybox:1.38.0-musl AS busybox
        FROM otel/opentelemetry-collector-contrib:0.162.0
        COPY --from=busybox /bin/busybox /busybox
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317", "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/busybox", "wget", "-q", "--spider", "http://localhost:13133/"]

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:${JAEGER_PORT:-16686}:16686"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/status"]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0-busybox
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.4
    volumes: ["./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["./toxiproxy.json:/config/toxiproxy.json:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:${TOXIPROXY_PORT:-8474}:8474"
      - "127.0.0.1:${TOXIPROXY_POSTGRES_PORT:-15432}:15432"
      - "127.0.0.1:${TOXIPROXY_REDIS_PORT:-16379}:16379"
      - "127.0.0.1:${TOXIPROXY_MOCK_TMS_PORT:-14010}:14010"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/toxiproxy-cli", "list"]

volumes:
  postgres-data:
  minio-data:
