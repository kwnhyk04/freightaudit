# Egress proxy of the public demo (infra/docker-compose.prod.yml). The worker and the tailscale container sit on an
# internal network and reach the internet only through this: HTTPS CONNECT on 443 to the hosts each one needs, nothing
# in a private range, nothing cached. Each client has its own port, so the rules match on the port name, not on IPs.
http_port 3128 name=worker
http_port 3129 name=tailscale

acl from_worker myportname worker
acl from_tailscale myportname tailscale
# Each port serves one client, by its fixed address on `outbound` (infra/docker-compose.prod.yml), so a compromised worker
# cannot borrow tailscale's way out to Tailscale's servers, nor tailscale the worker's.
acl worker_ip src 10.231.231.2
acl tailscale_ip src 10.231.231.3
acl https_port port 443
acl CONNECT method CONNECT

# Loopback, private, link-local, CGNAT and other non-public ranges, IPv4 and IPv6. A hostname is checked by every address
# it resolves to, so host.docker.internal (Docker Desktop's 192.168.65.254) is refused like the address itself. Squid
# keeps IPv4 as IPv4-mapped IPv6, so the IPv4 ranges cover mapped addresses too (::ffff:0:0/96 would mean all of IPv4).
acl non_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24
acl non_public dst 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl non_public dst ::/128 ::1/128 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8

# Built from squid's access log (dry run 2026-10-17, first real start 2026-10-18). -n: no reverse lookup, so a bare IP
# address never matches. The worker: Gemini and Groq. Tailscale: control plane, logs and Let's Encrypt (Funnel's
# certificate), plus its relays: with UDP blocked, tailscaled probes every region's relays over HTTPS (87 names in 28
# regions on the first start), so one pattern covers them and any that Tailscale adds or renames.
acl worker_hosts dstdomain -n generativelanguage.googleapis.com api.groq.com
acl tailscale_hosts dstdomain -n controlplane.tailscale.com log.tailscale.com acme-v02.api.letsencrypt.org
acl tailscale_derp dstdom_regex -n ^derp[0-9]+[a-z]*[.]tailscale[.]com$

http_access deny !CONNECT
http_access deny !https_port
http_access deny non_public
http_access allow from_worker worker_ip worker_hosts
http_access allow from_tailscale tailscale_ip tailscale_hosts
http_access allow from_tailscale tailscale_ip tailscale_derp
http_access deny all

# No protocol but the two proxy ports, and no peers. ICP, HTCP and SNMP default to port 0 already and no cache_peer line
# exists, so these restate the defaults; digest generation defaults to on, since this build has cache digests.
icp_port 0
htcp_port 0
snmp_port 0
digest_generation off

# A tunnel only: nothing stored, nothing on disk.
cache deny all
cache_mem 0 MB
pid_filename none
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
visible_hostname egress-proxy
shutdown_lifetime 1 seconds
