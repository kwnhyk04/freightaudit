global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerts on the app metrics; promtool tests them (prometheus-alerts.test.yml), and Grafana lists them under Alerting.
rule_files: [alerts.yml]

scrape_configs:
  - job_name: otel-collector
    # Keep the job and instance labels the collector derives from service.name and service.instance.id.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
