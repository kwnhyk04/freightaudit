# Production override for the backend on this PC, layered on docker-compose.yml:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --wait
# Data stores publish no host ports, services restart unless stopped, and each has a memory limit.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512m } } }

  redis:
    ports: !reset []
    # At the limit Redis rejects writes instead of being OOM-killed; BullMQ requires noeviction.
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256m } } }

  minio:
    ports: !reset []
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512m } } }

  otel-collector:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256m } } }

  jaeger:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512m } } }

  prometheus:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512m } } }

  grafana:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256m } } }

  # Fault injection is for tests, and its proxies would publish Postgres and Redis.
  toxiproxy:
    profiles: [chaos]
