"""
Integer amount in cents, serialized as a JSON number within the safe integer range.
"""
scalar Cents

"""
Calendar date in ISO 8601 format (YYYY-MM-DD).
"""
scalar Date

"""
Timestamp in ISO 8601 format with a UTC offset.
"""
scalar DateTime

"""
Queries for the invoice review UI.
"""
type Query {
  """
  Liveness probe; always returns ok.
  """
  health: String!

  """
  Invoices, newest first: a page going forward (first, after) or back (last, before), filtered by status, by search,
  which matches the invoice number, PRO number or carrier name, ignoring case, and by hasOpenFindings: true keeps the
  invoices with an open discrepancy, false those with none.
  """
  invoices(first: Int = 25, after: String, last: Int, before: String, status: InvoiceStatus, search: String, hasOpenFindings: Boolean): InvoiceConnection!

  """
  Counts and totals for the invoice list and the sidebar, read when asked. They may cover one carrier, the one that
  bills, and the invoices received from one UTC day to another, both included; from after to is refused. With any of
  them, openDeadLetters counts only the dead letters of the invoices kept.
  """
  invoiceSummary(carrierId: ID, from: Date, to: Date): InvoiceSummary!

  """
  One invoice, or null when it does not exist.
  """
  invoice(id: ID!): Invoice

  """
  Discrepancies across all invoices, newest first.
  """
  discrepancies(first: Int = 25, after: String, status: DiscrepancyStatus): DiscrepancyConnection!

  """
  Dead letters, newest first.
  """
  deadLetters(first: Int = 25, after: String, status: DeadLetterStatus): DeadLetterConnection!

  """
  This tenant's carriers by name. A plain list: a tenant has few carriers, and a correction picks one of them.
  """
  carriers: [Carrier!]!
}

"""
Reviewer actions.
"""
type Mutation {
  """
  Records a reviewer decision on a discrepancy.
  """
  resolveDiscrepancy(id: ID!, decision: DiscrepancyDecision!, note: String): Discrepancy!

  """
  Approves an invoice for payment.
  """
  approveInvoice(id: ID!): Invoice!

  """
  Decides every open discrepancy of a reconciled invoice in one transaction (dismissed for APPROVE_AS_BILLED, confirmed
  otherwise), then approves the invoice unless the decision is DISPUTE. seen lists every discrepancy of the invoice with
  the version the reviewer saw: any difference refuses with CONFLICT and changes nothing. A repeated requestId returns
  the invoice and changes nothing.
  """
  decideInvoice(id: ID!, decision: InvoiceDecision!, seen: [SeenDiscrepancy!]!, requestId: ID!): Invoice!

  """
  Corrects the carrier or PRO number that kept a NEEDS_REVIEW invoice from matching a shipment, then runs
  matching again. Called on an EXTRACTED invoice, it only queues matching again.
  """
  correctInvoice(id: ID!, carrierId: ID, proNumber: String): Invoice!

  """
  Rejects a NEEDS_REVIEW invoice for payment; the reason is kept in its audit trail. Final.
  """
  rejectInvoice(id: ID!, reason: String!): Invoice!

  """
  Runs a dead letter's job again from the step that failed.
  """
  replayDeadLetter(id: ID!): DeadLetter!
}

"""
An object with a globally unique ID.
"""
interface Node {
  """
  Globally unique ID.
  """
  id: ID!
}

"""
Pagination state of a connection.
"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""
Processing status of an invoice.
"""
enum InvoiceStatus {
  """
  Stored; waiting for extraction.
  """
  RECEIVED
  """
  Extraction is running.
  """
  EXTRACTING
  """
  Header and lines extracted; waiting for reconciliation.
  """
  EXTRACTED
  """
  Matching against the shipment and rate card is running.
  """
  RECONCILING
  """
  Checked against the shipment and rate card; each finding waits as an open discrepancy. Approval follows once every discrepancy has a decision.
  """
  RECONCILED
  """
  The extraction could not be trusted, such as a carrier or PRO number that matches no shipment; a person must check the document, then correct it, approve it or reject it.
  """
  NEEDS_REVIEW
  """
  Approved for payment. Final.
  """
  APPROVED
  """
  A reviewer refused the invoice for payment. Final.
  """
  REJECTED
  """
  A step used up its retries; replaying its dead letter restarts that step.
  """
  FAILED
}

"""
A carrier invoice uploaded for audit.
"""
type Invoice implements Node {
  id: ID!
  status: InvoiceStatus!
  """
  Why the invoice failed, such as a shipment without miles; null unless status is FAILED.
  """
  failureReason: String
  """
  Original upload file name.
  """
  filename: String!
  """
  SHA-256 of the PDF bytes, hex encoded.
  """
  contentHash: String!
  carrier: String
  """
  Invoice number printed by the carrier.
  """
  number: String
  issuedOn: Date
  """
  ISO 4217 currency code.
  """
  currency: String
  totalCents: Cents
  createdAt: DateTime!
  """
  Charge lines in invoice order.
  """
  lineItems: [LineItem!]!
  """
  Shipment the invoice was matched to.
  """
  shipment: Shipment
  """
  Rate card version used for reconciliation.
  """
  rateCardVersion: RateCardVersion
  """
  Discrepancies found on this invoice, newest first.
  """
  discrepancies(first: Int = 25, after: String, status: DiscrepancyStatus): DiscrepancyConnection!
  """
  PRO number used to match the shipment: a reviewer's correction, else what the model read.
  """
  proNumber: String
  """
  Why the invoice needs review, such as no_shipment_match or unsupported_currency: CAD; null unless status is NEEDS_REVIEW.
  """
  reviewReason: String
  """
  Number of this invoice's discrepancies still waiting for a decision.
  """
  openDiscrepancyCount: Int!
  """
  What the model read, before any correction; null until extraction ends.
  """
  extraction: Extraction
  """
  Everything that happened to the invoice, oldest first: pipeline moves and reviewer actions.
  """
  auditTrail: [AuditEntry!]!
  """
  The open dead letter of a FAILED invoice, to replay; null otherwise.
  """
  deadLetter: DeadLetter
}

"""
How a carrier name read from a document matched a known carrier.
"""
enum CarrierMatch {
  """
  Printed exactly as the known name.
  """
  EXACT
  """
  Equal after normalizing case, spacing and Unicode forms.
  """
  NORMALIZED
  """
  The reading holds the known name as whole words, as beside a title line.
  """
  CONTAINED
}

"""
What the model read from an invoice document.
"""
type Extraction {
  id: ID!
  """
  Model whose answer was kept.
  """
  model: String!
  """
  Step that produced the answer: first_pass, repair or fallback; needs_review when no answer passed validation.
  """
  step: String
  """
  Carrier name as the model read it.
  """
  carrierRead: String
  """
  How the reading matched a known carrier; null when it matched none.
  """
  carrierMatch: CarrierMatch
  """
  Why the output failed validation, by field path; empty when it passed.
  """
  problems: [String!]!
  """
  Charge lines as read, in document order; empty when the output failed validation.
  """
  lines: [ExtractedLine!]!
  extractedAt: DateTime!
}

"""
A charge line as the model read it.
"""
type ExtractedLine {
  """
  Position on the invoice, starting at 1.
  """
  lineNumber: Int!
  description: String!
  """
  Normalized charge code, for example LINEHAUL or FUEL.
  """
  chargeCode: String
  amountCents: Cents!
}

"""
Kind of entry in an invoice's audit trail.
"""
enum AuditAction {
  """
  The file was uploaded.
  """
  RECEIVED
  """
  The pipeline moved the invoice to another status.
  """
  STATUS_CHANGED
  """
  A reviewer corrected the carrier or PRO number and matching ran again.
  """
  CORRECTED
  """
  A reviewer rejected the invoice.
  """
  REJECTED
  """
  A reviewer approved the invoice for payment.
  """
  APPROVED
  """
  A reviewer confirmed a discrepancy: the overcharge is disputed.
  """
  DISCREPANCY_CONFIRMED
  """
  A reviewer dismissed a discrepancy: the billed amount stands.
  """
  DISCREPANCY_DISMISSED
  """
  A dead letter's job was run again.
  """
  REPLAYED
}

"""
One entry in an invoice's audit trail.
"""
type AuditEntry {
  id: ID!
  at: DateTime!
  """
  Who acted: a reviewer's name, api-key:<id> for a direct API call, or null for the pipeline.
  """
  actor: String
  action: AuditAction!
  """
  Text that goes with the entry: a reason, a note, a failure message, a review reason or how the carrier matched.
  """
  detail: String
  """
  Fields the entry changed, with their old and new values.
  """
  changes: [FieldChange!]!
}

"""
A field's value before and after an audit entry.
"""
type FieldChange {
  field: String!
  from: String
  to: String
}

"""
A carrier this tenant works with.
"""
type Carrier implements Node {
  id: ID!
  name: String!
}

"""
A charge line extracted from an invoice.
"""
type LineItem {
  id: ID!
  """
  Position on the invoice, starting at 1.
  """
  lineNumber: Int!
  description: String!
  """
  Normalized charge code, for example LINEHAUL or FUEL.
  """
  chargeCode: String
  amountCents: Cents!
}

"""
A shipment record synced from the TMS.
"""
type Shipment {
  id: ID!
  """
  Shipment reference in the TMS.
  """
  reference: String!
  carrier: String!
  origin: String!
  destination: String!
  shippedOn: Date!
  weightLb: Float
}

"""
One version of a contracted carrier rate card.
"""
type RateCardVersion {
  id: ID!
  carrier: String!
  """
  Increases with each new version for the carrier.
  """
  version: Int!
  """
  Null for a version open at the start, as a backfilled first version is.
  """
  effectiveFrom: Date
  """
  Null while this version is current.
  """
  effectiveTo: Date
}

"""
Kind of mismatch between billed and expected charges.
"""
enum DiscrepancyType {
  RATE_MISMATCH
  UNCONTRACTED_CHARGE
  DUPLICATE_CHARGE
  """
  Another invoice from the same carrier has the same number: a possible duplicate of the whole invoice, with no line and
  no money. It is decided on its own; while it is open, the invoice takes no bulk decision and cannot be approved.
  """
  DUPLICATE_INVOICE
  WEIGHT_MISMATCH
  ARITHMETIC_ERROR
}

"""
A reviewer's decision on every open discrepancy of an invoice at once.
"""
enum InvoiceDecision {
  """
  Dismiss every open discrepancy, so the billed amounts stand, then approve the invoice.
  """
  APPROVE_AS_BILLED
  """
  Confirm every open discrepancy: the overcharges are disputed, and the invoice stays reconciled.
  """
  DISPUTE
  """
  Confirm every open discrepancy, then approve the invoice: what the rate card allows is paid.
  """
  APPROVE_AT_RATE_CARD
}

"""
A discrepancy as the reviewer saw it.
"""
input SeenDiscrepancy {
  id: ID!
  """
  Its version when the reviewer's page loaded.
  """
  version: String!
}

"""
Review state of a discrepancy.
"""
enum DiscrepancyStatus {
  OPEN
  CONFIRMED
  DISMISSED
}

"""
Reviewer decision on a discrepancy.
"""
enum DiscrepancyDecision {
  """
  The overcharge is real.
  """
  CONFIRM
  """
  False flag; the billed amount stands.
  """
  DISMISS
}

"""
A billed charge that does not match the contract.
"""
type Discrepancy implements Node {
  id: ID!
  type: DiscrepancyType!
  status: DiscrepancyStatus!
  """
  Amount the contract allows.
  """
  expectedCents: Cents!
  """
  Amount the carrier billed.
  """
  billedCents: Cents!
  """
  How the expected amount was derived.
  """
  evidence: String!
  invoice: Invoice!
  """
  Billed line the discrepancy is about, if any.
  """
  lineItem: LineItem
  """
  Shipment used as evidence.
  """
  shipment: Shipment
  """
  Rate card version used as evidence.
  """
  rateCardVersion: RateCardVersion
  """
  Reviewer note from the last decision.
  """
  note: String
  resolvedAt: DateTime
  """
  Changes whenever the discrepancy does; decideInvoice compares it with the version the reviewer saw.
  """
  version: String!
}

"""
A page of invoices.
"""
type InvoiceConnection {
  edges: [InvoiceEdge!]!
  pageInfo: PageInfo!
  """
  Invoices matching the status and search, on all pages.
  """
  totalCount: Int!
  """
  Matching invoices before this page, so its first invoice is number offset + 1.
  """
  offset: Int!
}

"""
Counts and totals across the tenant's invoices.
"""
type InvoiceSummary {
  """
  Invoices per status; every status is listed, those with none as 0.
  """
  statusCounts: [InvoiceStatusCount!]!
  """
  Invoices received in the last 7 days.
  """
  receivedLast7Days: Int!
  """
  Discrepancies waiting for a decision.
  """
  openFindings: Int!
  """
  Invoices with at least one open discrepancy.
  """
  invoicesWithOpenFindings: Int!
  """
  When the oldest open discrepancy was found; null when none is open.
  """
  oldestOpenFindingAt: DateTime
  """
  What open discrepancies bill above the contract.
  """
  openOverchargeCents: Cents!
  """
  Reconciled invoices with no discrepancy at all: every line matched the rate card, and they wait for approval.
  """
  matchedRateCard: Int!
  """
  Dead letters waiting for a replay.
  """
  openDeadLetters: Int!
}

"""
How many invoices have one status.
"""
type InvoiceStatusCount {
  status: InvoiceStatus!
  count: Int!
}

"""
An invoice in a connection.
"""
type InvoiceEdge {
  cursor: String!
  node: Invoice!
}

"""
A page of discrepancies.
"""
type DiscrepancyConnection {
  edges: [DiscrepancyEdge!]!
  pageInfo: PageInfo!
}

"""
A discrepancy in a connection.
"""
type DiscrepancyEdge {
  cursor: String!
  node: Discrepancy!
}

"""
Review state of a dead letter.
"""
enum DeadLetterStatus {
  """
  Waiting for a replay.
  """
  OPEN
  """
  Its job was run again.
  """
  REPLAYED
}

"""
A job that used up its retries or met data it cannot process.
"""
type DeadLetter implements Node {
  id: ID!
  """
  Queue the job ran on: extract, reconcile or tms-sync.
  """
  queue: String!
  jobId: String!
  """
  Error of the job's last attempt.
  """
  error: String!
  attempts: Int!
  createdAt: DateTime!
  replayedAt: DateTime
  """
  Invoice the job worked on; null for TMS sync jobs.
  """
  invoice: Invoice
}

"""
A page of dead letters.
"""
type DeadLetterConnection {
  edges: [DeadLetterEdge!]!
  pageInfo: PageInfo!
}

"""
A dead letter in a connection.
"""
type DeadLetterEdge {
  cursor: String!
  node: DeadLetter!
}
