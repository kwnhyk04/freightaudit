query RecentUploads {
  invoices(first: 5) {
    edges {
      node {
        id
        status
        filename
        currency
        totalCents
        createdAt
        reviewReason
        failureReason
        hold
        shipment {
          id
        }
        discrepancies(first: 100) {
          edges {
            node {
              id
              status
              expectedCents
              billedCents
            }
          }
        }
        auditTrail {
          id
          at
          action
          changes {
            field
            to
          }
        }
      }
    }
  }
}
