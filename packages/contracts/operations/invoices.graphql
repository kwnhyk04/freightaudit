query Invoices($first: Int, $after: String, $last: Int, $before: String, $offset: Int, $status: InvoiceStatus, $hasOpenFindings: Boolean, $search: String) {
  invoices(first: $first, after: $after, last: $last, before: $before, offset: $offset, status: $status, hasOpenFindings: $hasOpenFindings, search: $search) {
    totalCount
    offset
    edges {
      cursor
      node {
        id
        status
        filename
        carrier
        number
        issuedOn
        currency
        totalCents
        createdAt
        openDiscrepancyCount
        hold
        reviewReason
        failureReason
        shipment {
          id
        }
        rateCardVersion {
          id
        }
        discrepancies(first: 100) {
          edges {
            node {
              id
              status
              expectedCents
              billedCents
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
