query Invoice($id: ID!) {
  invoice(id: $id) {
    id
    status
    failureReason
    reviewReason
    filename
    contentHash
    carrier
    number
    proNumber
    issuedOn
    currency
    totalCents
    createdAt
    openDiscrepancyCount
    lineItems {
      id
      lineNumber
      description
      chargeCode
      amountCents
    }
    extraction {
      id
      model
      step
      carrierRead
      carrierMatch
      problems
      extractedAt
      lines {
        lineNumber
        description
        chargeCode
        amountCents
      }
    }
    shipment {
      id
      reference
      carrier
      origin
      destination
      shippedOn
    }
    rateCardVersion {
      id
      version
      effectiveFrom
      effectiveTo
    }
    discrepancies(first: 100) {
      edges {
        node {
          id
          type
          status
          expectedCents
          billedCents
          evidence
          note
          resolvedAt
          version
          lineItem {
            id
            lineNumber
          }
          earlierInvoice {
            id
            number
            filename
            issuedOn
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    auditTrail {
      id
      at
      actor
      action
      detail
      changes {
        field
        from
        to
      }
      discrepancyId
    }
    deadLetter {
      id
      queue
      error
      createdAt
    }
  }
  carriers {
    id
    name
  }
}
