query Discrepancies($first: Int, $after: String, $status: DiscrepancyStatus) {
  discrepancies(first: $first, after: $after, status: $status) {
    edges {
      cursor
      node {
        id
        type
        status
        expectedCents
        billedCents
        evidence
        note
        resolvedAt
        lineItem {
          id
          lineNumber
          description
          chargeCode
        }
        invoice {
          id
          number
          filename
          carrier
          currency
          status
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
