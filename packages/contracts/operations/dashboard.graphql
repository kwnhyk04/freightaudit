query Dashboard($from: Date!, $to: Date!) {
  dashboard(from: $from, to: $to) {
    window {
      from
      to
      received
      matchedRateCard
      overbilledCents
      overbilledInvoices
      timed
      processingP50Ms
      processingP95Ms
      modelCostPerInvoiceMicroUsd
    }
    previous {
      received
      overbilledCents
    }
    weeks {
      start
      received
    }
    days {
      day
      received
      matchedRateCard
      neededReviewer
      failed
      overbilledCents
    }
    carriers {
      carrier
      overbilledCents
      invoices
    }
    pipeline {
      waitingToBeRead
      openDeadLetters
      claudeTokensToday
      freeModelTokensToday
    }
  }
  invoices(first: 5) {
    edges {
      node {
        id
        status
        filename
        carrier
        number
        currency
        totalCents
        createdAt
        openDiscrepancyCount
        hold
        shipment {
          id
        }
      }
    }
  }
}
