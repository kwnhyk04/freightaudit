query DeadLetters($first: Int, $after: String, $offset: Int, $status: DeadLetterStatus) {
  deadLetters(first: $first, after: $after, offset: $offset, status: $status) {
    totalCount
    offset
    edges {
      cursor
      node {
        id
        queue
        jobId
        error
        attempts
        createdAt
        replayedAt
        invoice {
          id
          number
          filename
          carrier
          status
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
