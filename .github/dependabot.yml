version: 2

# A week's cooldown keeps proposals clear of pnpm's release-age gate and of releases pulled soon after publishing.
# Majors are upgraded by hand, so each ecosystem ignores them and batches minor and patch updates into one PR.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/apps/api, /apps/worker, /apps/web, /infra/squid]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Node base images stay on the 24 LTS line.
      - dependency-name: node
        versions: ['>= 25']
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  # The image references in infra/docker-compose*.yml: stores, monitoring, tailscale, k6.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
