name: Release

on:
  push:
    branches: [main]
  # By hand (Actions > Release > Run workflow), for a push to main that started no Release; it publishes only from main.
  workflow_dispatch:

permissions: {}

# Releases run one at a time in push order; none is cancelled halfway through a push or a migration.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    # The ceiling for ci.yml's jobs; only its PR comment job, which a push skips, asks for pull-requests: write.
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  publish:
    name: publish (${{ matrix.app }})
    needs: checks
    # A run started by hand on another branch checks it but never moves latest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # squid is the public demo's egress proxy (infra/squid/Dockerfile); the PC pulls it like the rest.
      matrix:
        include:
          - { app: api, dockerfile: apps/api/Dockerfile }
          - { app: worker, dockerfile: apps/worker/Dockerfile }
          - { app: web, dockerfile: apps/web/Dockerfile }
          - { app: squid, dockerfile: infra/squid/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and tags
        id: image
        env:
          APP: ${{ matrix.app }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/freightaudit-$APP"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tags=$name:sha-${GITHUB_SHA::7},$name:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.image.outputs.name }}:scan
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: Trivy (fail on a fixable critical)
        env:
          IMAGE: ${{ steps.image.outputs.name }}:scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE"
      # The layers just scanned come from the builder's cache; the push adds the provenance attestation.
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.app }}

  # Nothing deploys from here: the backend on the PC is reachable only through Tailscale Funnel, so it pulls these
  # images itself (pnpm demo:up, docs/deploy.md). The UI deploys from Vercel's Git integration.
