name: Full eval (weekly)

on:
  # Weekly, not nightly: the full set's 98 cases take a large share of a day's free-tier quota.
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: full-eval
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  eval:
    name: full eval (98 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      report: ${{ steps.eval.outputs.report }}
      status: ${{ steps.eval.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # A re-run of this workflow run resumes from the cases its earlier attempts finished; a new run starts empty, so
      # each week measures the current code and the providers as they serve today.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/.cache
          key: eval-full-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: eval-full-${{ github.run_id }}-
      # Against the full floors in evals/thresholds-v2.json: exit 1 (a broken floor) fails the job and opens an issue,
      # exit 2 (a free-tier quota stop) only warns.
      - name: Eval every case on the pinned models
        id: eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          status=0
          pnpm eval --suite extraction --subset full || status=$?
          report=$(git ls-files --others --modified --exclude-standard -- 'evals/reports/*.md')
          {
            echo "status=$status"
            echo "report=$report"
            echo "json=${report%.md}.json"
          } >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 2 ]; then
            echo "::warning title=full eval::Stopped on a free-tier quota; re-run this workflow run once the quota resets to resume from the cached cases."
            exit 0
          fi
          exit "$status"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() }}
        with:
          path: evals/.cache
          key: eval-full-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.eval.outputs.report != '' }}
        with:
          name: eval-report-full
          path: |
            ${{ steps.eval.outputs.report }}
            ${{ steps.eval.outputs.json }}

  issue:
    name: regression issue
    needs: eval
    if: ${{ always() && needs.eval.outputs.status == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eval-report-full
      # One open issue collects the regressions until someone closes it.
      - name: Open the regression issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ needs.eval.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Full eval: a metric fell below its floor'
          { echo "Run: $RUN_URL"; echo; cat "$(basename "$REPORT")"; } > body.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
