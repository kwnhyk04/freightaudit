packages:
  - apps/*
  - packages/*
  - evals

catalog:
  "@faker-js/faker": ^10.6.0
  # The API alone: libraries record spans and metrics through it; only packages/telemetry starts the SDK.
  "@opentelemetry/api": ^1.10.0
  "@types/jest": ^30.0.0
  "@types/node": ^24.19.2
  "@types/pg": ^8.23.1
  bullmq: ^6.4.0
  drizzle-orm: ^0.45.4
  eslint: ^10.13.0
  # ioredis 6.0 is two days old; BullMQ 6 accepts >=5.
  ioredis: ^5.9.3
  jest: ^30.5.2
  # Unmaintained since 2022 but stable, MIT, with pinned dependencies; used to count and split pages.
  pdf-lib: ^1.17.1
  pg: ^8.23.1
  # typescript-eslint requires TypeScript <6.1; TypeScript 7 ships without the JS API it needs.
  typescript: ~6.0.3
  zod: ^4.6.7

# Native deps ship prebuilt binaries, so their install scripts stay off.
allowBuilds:
  # Its preinstall only echoes; the published dist is prebuilt.
  "@google/genai": false
  "@parcel/watcher": false
  "@swc/core": false
  # ssh2 and cpu-features (SSH transports of Testcontainers and its dockerode) compile optional native crypto; ssh2
  # falls back to JavaScript.
  cpu-features: false
  # BullMQ's optional msgpack addon; msgpackr falls back to JavaScript without it.
  msgpackr-extract: false
  # dockerode's gRPC protos; the postinstall only checks how dependents pin its version.
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# openapi-typescript 7 declares typescript ^5; its output on 6.0 is checked by pnpm contracts:check.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

# Dev-only parents that lag their advisories (2026-10-24): @graphql-eslint 4.4.2 (latest) requires utils ^10, whose
# last release is vulnerable (GHSA-c4qx-w738-7hr3, fixed 12.0.2), and testcontainers 12.2.1 (latest) pins undici 8.11.2
# (GHSA-xjj6-f33q-929c, fixed 8.12.2). Drop each override once its parent ships the fix itself.
overrides:
  "@graphql-eslint/eslint-plugin>@graphql-tools/utils": ^12.0.2
  testcontainers>undici: ^8.12.2

# Advisory pnpm audit accepts (2026-10-15); it sits in packages/contracts codegen tooling that reads only this
# repository's files, never in a runtime image. Drop the entry once a fixed version reaches its dependent.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3, stack exhaustion on deeply nested patterns: no fixed release exists (graphql-codegen globs).
    - GHSA-vfj7-8cjw-p6xm
