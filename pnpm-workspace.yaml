packages:
  - apps/*
  - packages/*
  - evals

catalog:
  "@faker-js/faker": ^10.6.0
  # The API alone: libraries record spans and metrics through it; only packages/telemetry starts the SDK.
  "@opentelemetry/api": ^1.9.1
  "@types/jest": ^30.0.0
  "@types/node": ^24.19.2
  "@types/pg": ^8.23.1
  bullmq: ^6.3.9
  drizzle-orm: ^0.45.4
  eslint: ^10.12.0
  # ioredis 6.0 is two days old; BullMQ 6 accepts >=5.
  ioredis: ^5.9.3
  jest: ^30.5.2
  # Unmaintained since 2022 but stable, MIT, with pinned dependencies; used to count and split pages.
  pdf-lib: ^1.17.1
  pg: ^8.23.1
  # typescript-eslint requires TypeScript <6.1; TypeScript 7 ships without the JS API it needs.
  typescript: ~6.0.3
  zod: ^4.6.7

# Native deps ship prebuilt binaries, so their install scripts stay off.
allowBuilds:
  # Its preinstall only echoes; the published dist is prebuilt.
  "@google/genai": false
  "@parcel/watcher": false
  "@swc/core": false
  # ssh2 and cpu-features (SSH transports of Testcontainers and its dockerode) compile optional native crypto; ssh2
  # falls back to JavaScript.
  cpu-features: false
  # BullMQ's optional msgpack addon; msgpackr falls back to JavaScript without it.
  msgpackr-extract: false
  # dockerode's gRPC protos; the postinstall only checks how dependents pin its version.
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# openapi-typescript 7 declares typescript ^5; its output on 6.0 is checked by pnpm contracts:check.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

# Advisories pnpm audit accepts (2026-10-15); both sit in packages/contracts lint and codegen tooling that reads only
# this repository's files, never in a runtime image. Drop an entry once a fixed version reaches its dependents.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3, stack exhaustion on deeply nested patterns: no fixed release exists (graphql-codegen globs).
    - GHSA-vfj7-8cjw-p6xm
    # @graphql-tools/utils <=12.0.0, prototype pollution in mergeDeep: fixed only in 12.0.1, and @graphql-eslint 4.4.2
    # (latest) requires ^10.
    - GHSA-7mx3-vvmw-hjmv
